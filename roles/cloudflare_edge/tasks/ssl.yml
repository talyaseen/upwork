---
# Zone-level TLS hardening so the Cloudflare -> edge hop is validated:
#   - SSL mode "Full (strict)"  (Cloudflare validates edge's Origin cert)
#   - minimum TLS 1.2, TLS 1.3 on, Always Use HTTPS
#   - Authenticated Origin Pulls ZONE toggle - only pushed when aop_mode == "zone".
#     The DEFAULT is PER-HOSTNAME AOP with a custom cert (see aop_per_hostname.yml),
#     because the zone toggle does not reliably present a client cert on FREE zones.

- name: Set SSL mode to Full (strict)
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ _cf_zone_id }}/settings/ssl"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      value: "{{ cloudflare_ssl_mode }}"
    status_code: [200]
  no_log: true

- name: Set minimum TLS version
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ _cf_zone_id }}/settings/min_tls_version"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      value: "{{ cloudflare_min_tls_version }}"
    status_code: [200]
  no_log: true

- name: Enable TLS 1.3
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ _cf_zone_id }}/settings/tls_1_3"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      value: "{{ cloudflare_tls_1_3 }}"
    status_code: [200]
  no_log: true

- name: Enable Always Use HTTPS
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ _cf_zone_id }}/settings/always_use_https"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      value: "{{ cloudflare_always_use_https }}"
    status_code: [200]
  no_log: true

- name: Enable zone-level Authenticated Origin Pulls
  ansible.builtin.uri:
    url: "{{ cloudflare_api_base }}/zones/{{ _cf_zone_id }}/origin_tls_client_auth/settings"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      enabled: "{{ cloudflare_aop_zone_enabled | bool }}"
    # CF returns 202 (Accepted) for the zone AOP toggle, not 200 - accept both.
    status_code: [200, 202]
  no_log: true
  when: cloudflare_aop_zone_enabled | bool
