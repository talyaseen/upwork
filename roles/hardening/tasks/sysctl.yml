---
# Kernel / network sysctl hardening + core-dump suppression.

- name: Deploy sysctl hardening drop-in
  ansible.builtin.template:
    src: 99-hardening-sysctl.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Disable core dumps for setuid programs (limits.conf)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/10-hardening-nocore.conf
    content: |
      # Ansible managed (hardening role) - do not edit by hand
      * hard core 0
      root hard core 0
    owner: root
    group: root
    mode: "0644"
  when: hardening_disable_core_dumps | bool

- name: Ensure the systemd coredump drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardening_disable_core_dumps | bool

- name: Disable systemd coredump storage
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/10-hardening.conf
    content: |
      # Ansible managed (hardening role) - do not edit by hand
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    owner: root
    group: root
    mode: "0644"
  when: hardening_disable_core_dumps | bool

- name: Apply sysctl now (flush handlers so settings are live)
  ansible.builtin.meta: flush_handlers
