---
# ============================================================================
# Parameterized inventory. NO real values live here - everything resolves from
# group_vars/all/vault.yml (gitignored). Nothing real is committed.
#
# Three play targets:
#   edge     - the reverse-proxy VPS we SSH IN to configure.
#   cloudflare - a local-connection target for the Cloudflare REST API.
#   hub        - the hub backend host, used ONLY by the PREP / DO-NOT-APPLY
#                hub-allowlist play (adds a ufw rule for edge's IP). Its
#                address is a vaulted secret and is never published anywhere.
# ============================================================================
all:
  children:
    edge:
      # The public reverse-proxy VPS (a small, disposable edge box). Clients only
      # ever reach it via Cloudflare's proxied edge; its origin IP is hidden by the
      # orange-cloud DNS record and ufw admits ONLY Cloudflare's published ranges
      # on :443.
      #
      # CONNECTION = the HARDENED identity: admin user `deploy` over the automation
      # key (installed + verified by playbooks/bootstrap.yml).
      # First-contact-over-password is handled inside bootstrap.yml (play-level
      # connection override), so it never appears here.
      hosts:
        edge_host:
          # Alias: edge-01. IP is relayed at apply time into vault.local
          # (vault_edge_public_ip == this box). edge_host_* resolve from
          # group_vars/all/vars.yml.
          ansible_host: "{{ edge_host_ip }}"
          ansible_user: "{{ edge_host_admin_user }}"
          ansible_port: "{{ edge_host_ssh_port | default(22) }}"
          ansible_ssh_private_key_file: "{{ edge_host_ssh_key_path }}"

    cloudflare:
      # Control-machine-local target for the Cloudflare API (DNS + SSL + Access +
      # WAF). No server contact - it talks to the Cloudflare REST API over HTTPS.
      hosts:
        cloudflare_api:
          ansible_connection: local

    hub:
      # The hub host that serves the FastAPI app. Touched ONLY by the PREP /
      # DO-NOT-APPLY playbooks/hub.yml (mTLS-terminating nginx + a ufw rule
      # admitting ONLY edge's IP to the hub mTLS port). The hub address is a
      # HARD secret (hub_ansible_host in vault) and must never be published.
      # Default connection is local (run the play ON the hub); set
      # hub_connection=ssh + hub_ansible_host/user/key in vault to drive it over
      # SSH instead.
      hosts:
        hub_backend:
          ansible_connection: "{{ hub_connection | default('local') }}"
          ansible_host: "{{ hub_ansible_host | default('127.0.0.1') }}"
          ansible_user: "{{ hub_ansible_user | default(omit) }}"
          ansible_ssh_private_key_file: "{{ hub_ansible_ssh_key | default(omit) }}"
