[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# ansible-vault password file (gitignored). Create it with your vault password:
#   echo 'your-vault-password' > .vault_pass
# Override per-invocation with --vault-password-file or ANSIBLE_VAULT_PASSWORD_FILE.
vault_password_file = .vault_pass
retry_files_enabled = False
# YAML-formatted task output. The old community.general.yaml stdout callback was
# removed in community.general 12+, so use the builtin default callback with
# result_format = yaml (the modern equivalent that survives newer ansible-core).
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 5
# edge is a fresh VPS each provision; default off so the first connect doesn't
# block on an unknown host key. Pre-seed edge's key in known_hosts and flip to
# True if you prefer strict checking for the public edge.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
