# systemd drop-in for the Ollama service (the CPU-tier inference engine).
# Install as: /etc/systemd/system/ollama.service.d/10-thread-cap.conf
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-thread-cap.conf /etc/systemd/system/ollama.service.d/10-thread-cap.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Enforces two hub-wide guarantees that the application layer cannot (Ollama runs
# as its own server and reads its OWN environment, not the app's):
#
# 1. THREAD CAP (MODEL_MAX_THREADS intent): confine Ollama + its llama-server
#    children to 32 of the box's 56 CPUs. llama.cpp may spawn more threads than
#    that, but CPUAffinity hard-confines them to 32 cores, so inference can never
#    monopolize the host; the FastAPI serving layer keeps the other 24 cores.
#    (Validated 2026-06-30: without this, llama-server used >32 threads box-wide;
#    with it, llama-server Cpus_allowed_list == 0-31.)
#
# 2. CPU FALLBACK PINNED OFF THE GPU: the GPU is reserved for the demo's vLLM 7B
#    (and for training). Without CUDA_VISIBLE_DEVICES="" the Ollama 1B auto-offloads
#    onto a T4 and contends with vLLM/training. The app sets this in its OWN process,
#    but the Ollama SERVER is separate, so the guarantee MUST live here.
#    (Validated 2026-06-30: with it, a 1B generation kept GPU memory at 0 MiB.)

[Service]
CPUAffinity=0-31
Environment="CUDA_VISIBLE_DEVICES="
Environment="OLLAMA_NUM_PARALLEL=1"
